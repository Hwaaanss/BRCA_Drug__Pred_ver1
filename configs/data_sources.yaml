# Remote locations of every external file the pipeline needs.
#
# URLs are kept in config rather than in code so that a GDSC/DepMap release
# change is a one-line edit.  If a download fails the pipeline reports the
# failure — it never substitutes another file silently.
#
# Verify the current filenames at:
#   GDSC      https://www.cancerrxgene.org/downloads/bulk_download
#   Reactome  https://reactome.org/download-data
#   DepMap    https://depmap.org/portal/download/

gdsc_raw:
  GDSC2:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/GDSC2_public_raw_data_25Feb20.csv.zip
    filename: GDSC2_public_raw_data.csv.zip
    unzip: true
  GDSC1:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/GDSC1_public_raw_data_25Feb20.csv.zip
    filename: GDSC1_public_raw_data.csv.zip
    unzip: true

gdsc_fitted:
  GDSC2:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/GDSC2_fitted_dose_response_27Oct23.xlsx
    filename: GDSC2_fitted_dose_response.xlsx
  GDSC1:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/GDSC1_fitted_dose_response_27Oct23.xlsx
    filename: GDSC1_fitted_dose_response.xlsx

gdsc_annotation:
  cell_lines:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/Cell_Lines_Details.xlsx
    filename: Cell_Lines_Details.xlsx
  compounds:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/screened_compounds_rel_8.5.csv
    filename: screened_compounds.csv

omics:
  expression:
    url: https://www.cancerrxgene.org/gdsc1000/GDSC1000_WebResources//Data/preprocessed/Cell_line_RMA_proc_basalExp.txt.zip
    filename: Cell_line_RMA_proc_basalExp.txt.zip
    unzip: true
  mutation:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/mutations_all_20230202.zip
    filename: mutations_all.zip
    unzip: true
  cnv:
    url: https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/cnv_gistic_20191101.zip
    filename: cnv_gistic.zip
    unzip: true

pathways:
  reactome:
    url: https://reactome.org/download/current/ReactomePathways.gmt
    filename: ReactomePathways.gmt
